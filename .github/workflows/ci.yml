name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package-tests:
    name: swift test (PitchCoachKit)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: swift --version
      - name: Run package tests
        run: swift test --package-path Packages/PitchCoachKit

  app-tests:
    name: xcodebuild test (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Pick an available iPhone simulator
        id: simulator
        # Runner 映像的模擬器機型會隨版本更新，取最新 iOS runtime 中的第一台 iPhone
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in devices if ".iOS-" in k), key=lambda k: [int(x) for x in k.split(".iOS-")[1].split("-")], reverse=True)
          print(next(d["udid"] for k in runtimes for d in devices[k] if d["name"].startswith("iPhone")))
          ')
          xcrun simctl list devices available | grep "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build and run unit and UI tests
        # 以環境變數傳入，不在腳本中直接展開 ${{ }} 運算式
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: >
          xcodebuild test
          -project PitchCoach.xcodeproj
          -scheme PitchCoach
          -destination "id=$SIMULATOR_UDID"
