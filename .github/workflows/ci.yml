name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package-tests:
    name: swift test (PitchCoachKit)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Run package tests
        run: swift test --package-path Packages/PitchCoachKit

  app-build:
    name: xcodebuild (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: >
          xcodebuild build
          -project PitchCoach.xcodeproj
          -scheme PitchCoach
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
